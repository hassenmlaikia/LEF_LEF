name: lef_lef
description: LEF_LEF social mobility discovery services app.
publish_to: none
version: 1.0.0+78

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.1.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  shared_preferences: ^2.5.3
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  http: ^1.5.0
  image_picker: ^1.2.1
  video_player: ^2.10.0
  firebase_storage: ^13.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/lef_logo_mark.png
    - assets/lef_logo_lockup.png
    - assets/splash_dark_real.jpg
    - assets/splash_light_real.jpg
    - assets/onboarding_mobility_real.jpg
    - assets/onboarding_connect_real.jpg
    - assets/onboarding_safe_real.jpg
